# Project-wide Gradle settings.

# Increase JVM heap to prevent OutOfMemoryError during D8/dex merging
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Suppress compileSdk 35 warning for AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Kotlin/Android specific
kotlin.code.style=official
android.useAndroidX=true
